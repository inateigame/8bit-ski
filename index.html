<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>8ビットスキー 4・6操作版</title><style>body{background:#10182c;color:#def;text-align:center;font-family:monospace}canvas{background:#effaff;border:4px solid #567;max-width:95vw;max-height:75vh;image-rendering:pixelated}button{padding:12px;margin:8px;background:#234;color:white;border:2px solid #8cf}</style><h2>8-BIT SKI</h2><p>４：左　６：右　SPACE：開始・再挑戦　P：一時停止</p><canvas id="c" width="320" height="400" tabindex="0"></canvas><div><button id="start">開始 / 一時停止</button></div><script>
const c=document.getElementById('c'),g=c.getContext('2d');let keys=new Set(),mode='title',px=160,obs=[],distance=0,bonus=0,passes=0,misses=0,time=0,spawn=0,gate=0,last=0,hi=0;try{hi=+localStorage.getItem('ski8high')||0}catch(e){}
function begin(){keys.clear();px=160;obs=[];distance=bonus=passes=misses=time=spawn=gate=0;mode='play'}
function action(){if(mode==='title'||mode==='over')begin();else mode=mode==='play'?'pause':'play';c.focus()}
document.getElementById('start').onclick=action;
function side(e){if(e.code==='Digit4'||e.code==='Numpad4'||e.key==='4'||e.key==='４')return 'left';if(e.code==='Digit6'||e.code==='Numpad6'||e.key==='6'||e.key==='６')return 'right';return null}
window.addEventListener('keydown',e=>{const d=side(e);if(d){e.preventDefault();keys.add(e.code||e.key)}if(e.code==='Space'){e.preventDefault();if(!e.repeat)action()}if(e.code==='KeyP'&&!e.repeat&&(mode==='play'||mode==='pause'))mode=mode==='play'?'pause':'play'});
window.addEventListener('keyup',e=>keys.delete(e.code||e.key));
function held(d){return [...keys].some(k=>d==='left'?['Digit4','Numpad4','4','４'].includes(k):['Digit6','Numpad6','6','６'].includes(k))}
function pause(){keys.clear();if(mode==='play')mode='pause'}window.addEventListener('blur',pause);document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});
function crash(){mode='over';hi=Math.max(hi,Math.floor(distance)+bonus);try{localStorage.setItem('ski8high',hi)}catch(e){}}
function update(dt){if(mode!=='play')return;time+=dt;const v=Math.min(205,85+time*1.65);distance+=v*dt/9;px=Math.max(23,Math.min(297,px+((held('right')?1:0)-(held('left')?1:0))*158*dt));spawn-=dt;gate-=dt;if(gate<=0){obs.push({type:'gate',x:65+Math.random()*190,y:-30,done:false});gate=2.8+Math.random()*.6}if(spawn<=0){let a=28+Math.random()*264;if(!obs.some(o=>o.type==='gate'&&Math.abs(o.y+25)<100&&Math.abs(o.x-a)<65))obs.push({type:Math.random()<.75?'tree':'rock',x:a,y:-25});spawn=Math.max(.36,.95-time*.006)+Math.random()*.28}for(const o of obs){let old=o.y;o.y+=v*dt;if(o.type==='gate'){if(!o.done&&old<322&&o.y>=322){o.done=true;if(Math.abs(px-o.x)<37){passes++;bonus+=100}else misses++}if(Math.abs(o.y-322)<13&&(Math.abs(px-o.x+45)<10||Math.abs(px-o.x-45)<10)){crash();break}}else if(Math.abs(o.y-322)<17&&Math.abs(px-o.x)<18){crash();break}}obs=obs.filter(o=>o.y<440)}
function txt(t,y,size=12,col='#fff'){g.fillStyle=col;g.font='bold '+size+'px monospace';g.textAlign='center';g.fillText(t,160,y)}
function flag(a,b,r){g.fillStyle='#345';g.fillRect(a,b-22,2,27);g.fillStyle='#f36';g.fillRect(r?a-12:a+2,b-22,12,8)}
function draw(){g.fillStyle='#eaf8ff';g.fillRect(0,0,320,400);g.fillStyle='#b6d8e8';for(let i=0;i<40;i++)g.fillRect((i*73)%300+10,(i*47+distance*6)%400,2,3);g.fillStyle='#9bc';g.fillRect(9,0,3,400);g.fillRect(308,0,3,400);for(const o of obs){let a=Math.round(o.x),b=Math.round(o.y);if(o.type==='gate'){flag(a-45,b,false);flag(a+45,b,true)}else if(o.type==='tree'){g.fillStyle='#654';g.fillRect(a-2,b+5,4,12);g.fillStyle='#075';g.fillRect(a-4,b-14,8,6);g.fillRect(a-8,b-8,16,7);g.fillRect(a-12,b-1,24,9);g.fillStyle='#fff';g.fillRect(a-4,b-14,7,3)}else{g.fillStyle='#789';g.fillRect(a-10,b-5,20,11);g.fillRect(a-6,b-9,12,5)}}let a=Math.round(px);g.fillStyle='#345';g.fillRect(a-7,312,3,25);g.fillRect(a+5,312,3,25);g.fillRect(a-12,311,2,16);g.fillRect(a+11,311,2,16);g.fillStyle='#f35';g.fillRect(a-6,308,13,12);g.fillStyle='#fba';g.fillRect(a-4,301,8,7);g.fillStyle='#235';g.fillRect(a-4,299,8,4);g.fillStyle='#11213a';g.fillRect(0,0,320,40);txt('SCORE '+(Math.floor(distance)+bonus)+'   HI '+hi,16);txt('GATE '+passes+'  MISS '+misses+'  '+Math.floor(distance)+'m',32,11,'#8ef');if(mode!=='play'){g.fillStyle='rgba(10,20,40,.9)';g.fillRect(22,120,276,152);txt(mode==='title'?'8-BIT SKI':mode==='over'?'CRASH!':'PAUSE',157,26,'#8ff');txt('4 = LEFT   6 = RIGHT',192,14);txt(mode==='over'?'SCORE '+(Math.floor(distance)+bonus):'PASS FLAGS +100',219);txt('PRESS SPACE',250,14,'#fd8')}}
function loop(t){let dt=last?Math.min((t-last)/1000,.035):0;last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></html>
